
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{background:linear-gradient(135deg,#12151a 0%,#1a1e26 50%,#151820 100%);min-height:600px;padding:16px;color:#c9cdd4;font-family:var(--font-sans,sans-serif)}
.panel{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.panel-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.9px;color:#5a6370;margin-bottom:9px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row+.row{margin-top:8px}
.toggle{position:relative;width:36px;height:18px;background:#2e3340;border-radius:9px;cursor:pointer;transition:background .2s;border:0.5px solid rgba(255,255,255,0.08);flex-shrink:0}
.toggle.on{background:#2563eb}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
.tlabel{font-size:12px;color:#e0e4ea;font-weight:500}
.slabel{font-size:12px;color:#7a8494}
.vbadge{background:rgba(59,130,246,0.15);color:#60a5fa;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;min-width:24px;text-align:center}
.ctrls{display:flex;align-items:center;gap:6px}
.cb{width:24px;height:24px;border:0.5px solid rgba(255,255,255,0.12);border-radius:5px;background:rgba(255,255,255,0.04);color:#c9cdd4;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb:hover{background:rgba(255,255,255,0.09)}
input[type=range]{accent-color:#3b82f6;width:110px;cursor:pointer}
.rg{display:flex;gap:8px;flex-wrap:wrap}
.rb{display:flex;align-items:center;gap:5px;padding:5px 10px;border:0.5px solid rgba(255,255,255,0.1);border-radius:6px;cursor:pointer;font-size:11px;color:#7a8494;background:rgba(255,255,255,0.02);transition:all .15s;user-select:none}
.rb.active{border-color:#3b82f6;background:rgba(59,130,246,0.12);color:#60a5fa}
.rdot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;position:relative;flex-shrink:0}
.rb.active .rdot::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:#3b82f6}
.start-btn{display:block;width:100%;padding:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;margin-top:6px;letter-spacing:.2px}
.start-btn:hover{opacity:.88}
.start-btn:disabled{opacity:.35;cursor:not-allowed}
.cvwrap{border-radius:10px;overflow:hidden;background:#0d0f13;border:0.5px solid rgba(255,255,255,0.06);margin-top:10px}
canvas{display:block;width:100%}
.logbox{background:rgba(0,0,0,0.3);border:0.5px solid rgba(255,255,255,0.06);border-radius:7px;max-height:90px;overflow-y:auto;padding:6px 10px;margin-top:8px;font-size:10px;font-family:var(--font-mono,monospace)}
.le{padding:1px 0;color:#5a6370}
.le.i{color:#60a5fa}.le.ok{color:#34d399}.le.er{color:#f87171}.le.w{color:#fbbf24}
.sep{width:1px;height:14px;background:rgba(255,255,255,0.08)}
#sw-config{display:none}
</style>
<div class="wrap">
  <div class="panel">
    <div class="panel-title">Protocol Mode</div>
    <div class="row">
      <span class="slabel">Stop &amp; Wait</span>
      <div class="toggle" id="snw-t" onclick="toggleSNW()"></div>
      <span class="tlabel" id="snw-l" style="font-size:11px">OFF</span>
      <div class="sep"></div>
      <span class="slabel">Sliding Window</span>
      <div class="toggle" id="sl-t" onclick="toggleSL()"></div>
      <span class="tlabel" id="sl-l" style="font-size:11px">OFF</span>
      <div class="sep"></div>
      <span class="slabel">Cycles:</span>
      <div class="ctrls">
        <div class="cb" onclick="adjC(-1)">−</div>
        <span class="vbadge" id="cv">3</span>
        <div class="cb" onclick="adjC(1)">+</div>
        <span style="font-size:10px;color:#3a4050">max 10</span>
      </div>
    </div>
  </div>
  <div class="panel" id="sw-config">
    <div class="panel-title">Sliding Window Options</div>
    <div class="row">
      <span class="slabel">Window:</span>
      <input type="range" min="2" max="9" value="4" id="ws" oninput="document.getElementById('wv').textContent=this.value">
      <span class="vbadge" id="wv">4</span>
      <div class="sep"></div>
      <div class="rg" id="mg">
        <div class="rb active" data-m="normal" onclick="setM('normal')"><span class="rdot"></span>Normal</div>
        <div class="rb" data-m="loss" onclick="setM('loss')"><span class="rdot"></span>What if it Losses?</div>
      </div>
    </div>
  </div>
  <button class="start-btn" id="sbtn" onclick="startViz()">▶ Start Simulation</button>
  <div class="cvwrap"><canvas id="cv2" height="420"></canvas></div>
  <div class="logbox" id="lb"><div class="le">Configure and press Start.</div></div>
</div>

<script>
const cv=document.getElementById('cv2'),ctx=cv.getContext('2d');
let W=cv.offsetWidth,H=cv.height;
cv.width=W;

let cfg={sliding:false,cycles:3,winSize:4,mode:'normal'};
let rafId=null,running=false;

function toggleSNW(){
  const t=document.getElementById('snw-t'),l=document.getElementById('snw-l');
  t.classList.toggle('on');l.textContent=t.classList.contains('on')?'ON':'OFF';
}
function toggleSL(){
  const t=document.getElementById('sl-t'),l=document.getElementById('sl-l');
  cfg.sliding=!cfg.sliding;t.classList.toggle('on');l.textContent=cfg.sliding?'ON':'OFF';
  document.getElementById('sw-config').style.display=cfg.sliding?'block':'none';
}
function adjC(d){cfg.cycles=Math.min(10,Math.max(1,cfg.cycles+d));document.getElementById('cv').textContent=cfg.cycles}
function setM(m){cfg.mode=m;document.querySelectorAll('[data-m]').forEach(e=>e.classList.toggle('active',e.dataset.m===m))}

function lg(msg,cls=''){
  const b=document.getElementById('lb'),d=document.createElement('div');
  d.className='le '+cls;d.textContent=msg;b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function clrLog(){document.getElementById('lb').innerHTML=''}

const SX=64,RX_F=0.88;
function getRX(){return Math.floor((cv.offsetWidth||W)*RX_F)}
const TOP=40,BOT=380;
const PKT_COL=['#3b82f6','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#14b8a6','#a78bfa','#f97316'];

let trails=[],particles=[];

function drawScene(){
  W=cv.offsetWidth;cv.width=W;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0f13');bg.addColorStop(1,'#0a0c10');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  const rx=getRX();
  // glow behind lines
  function glowLine(x,col){
    const g=ctx.createLinearGradient(0,TOP,0,BOT);
    g.addColorStop(0,col+'00');g.addColorStop(0.5,col+'33');g.addColorStop(1,col+'00');
    ctx.strokeStyle=g;ctx.lineWidth=6;ctx.globalAlpha=0.4;
    ctx.beginPath();ctx.moveTo(x,TOP);ctx.lineTo(x,BOT);ctx.stroke();ctx.globalAlpha=1;
  }
  glowLine(SX,'#3b82f6');glowLine(rx,'#10b981');
  // dashed lines
  ctx.setLineDash([4,6]);ctx.lineWidth=1;
  ctx.strokeStyle='rgba(59,130,246,0.25)';
  ctx.beginPath();ctx.moveTo(SX,TOP);ctx.lineTo(SX,BOT);ctx.stroke();
  ctx.strokeStyle='rgba(16,185,129,0.25)';
  ctx.beginPath();ctx.moveTo(rx,TOP);ctx.lineTo(rx,BOT);ctx.stroke();
  ctx.setLineDash([]);

  // labels
  function nodeLabel(x,y,title,sub,col){
    ctx.beginPath();ctx.roundRect(x-34,y-18,68,36,6);
    ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fill();
    ctx.strokeStyle=col+'55';ctx.lineWidth=0.5;ctx.stroke();
    ctx.fillStyle=col;ctx.font='500 11px sans-serif';ctx.textAlign='center';
    ctx.fillText(title,x,y-4);
    ctx.fillStyle='#5a6370';ctx.font='10px sans-serif';ctx.fillText(sub,x,y+9);
  }
  nodeLabel(SX,TOP-4,'SENDER','TX','#3b82f6');
  nodeLabel(rx,TOP-4,'RECEIVER','RX','#10b981');
  nodeLabel(SX,BOT+4,'SENDER','TX','#3b82f6');
  nodeLabel(rx,BOT+4,'RECEIVER','RX','#10b981');
}

// Trail segment: from (x0,y0) to (x1,y1), t=0..1 progress, col, label, lost, isAck
function makePkt(x0,y0,x1,y1,col,lbl,lost,isAck,delay){
  return{x0,y0,x1,y1,col,lbl,lost,isAck,delay:delay||0,t:-( delay||0),done:false,trailPts:[]};
}

let anim=[];
let queue=[];
let qTimer=0;

function spawnNext(){
  if(queue.length===0)return;
  const item=queue.shift();
  anim.push(item);
}

function lerp(a,b,t){return a+(b-a)*t}

function drawTrail(pts,col,isAck,lost){
  if(pts.length<2)return;
  const alpha=isAck?0.6:0.7;
  for(let i=1;i<pts.length;i++){
    const frac=i/pts.length;
    const a=frac*alpha*(lost?0.5:1);
    ctx.globalAlpha=a;
    ctx.strokeStyle=col;
    ctx.lineWidth=lost?1:1.5;
    ctx.setLineDash(lost?[3,3]:[]);
    ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }
  // glowing head
  if(pts.length>0){
    const head=pts[pts.length-1];
    ctx.globalAlpha=lost?0.3:0.8;
    const gr=ctx.createRadialGradient(head.x,head.y,0,head.x,head.y,8);
    gr.addColorStop(0,col+'ff');gr.addColorStop(1,col+'00');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(head.x,head.y,8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawPktIcon(x,y,lbl,col,isAck,lost,size){
  size=size||16;
  ctx.globalAlpha=lost?0.5:1;
  if(isAck){
    ctx.beginPath();ctx.roundRect(x-20,y-10,40,20,10);
    ctx.fillStyle=col+'22';ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.setLineDash(lost?[3,2]:[]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=lost?'#f87171':col;ctx.font='600 9px sans-serif';ctx.textAlign='center';
    ctx.fillText(lost?'LOST':lbl,x,y+3);
  } else {
    ctx.beginPath();ctx.roundRect(x-size,y-size*0.65,size*2,size*1.3,4);
    ctx.fillStyle=col+'22';ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='600 9px sans-serif';ctx.textAlign='center';
    ctx.fillText(lbl,x,y+3);
    if(lost){
      ctx.strokeStyle='#f87171';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x-8,y-7);ctx.lineTo(x+8,y+7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+8,y-7);ctx.lineTo(x-8,y+7);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

const SPEED=0.014;

function tick(){
  drawScene();
  const rx=getRX();
  let allDone=true;

  for(const o of anim){
    if(o.t<0){o.t+=SPEED;allDone=false;continue;}
    if(o.done)continue;
    allDone=false;
    o.t+=SPEED*(o.lost&&o.t>0.55?1.5:1);
    const t=Math.min(o.t,1);
    const fade=o.lost&&t>0.55;
    const x=lerp(o.x0,o.x1,t);
    const y=lerp(o.y0,o.y1,t);
    o.trailPts.push({x,y});
    if(o.trailPts.length>50)o.trailPts.shift();

    drawTrail(o.trailPts,o.col,o.isAck,o.lost&&t>0.5);
    if(!fade)drawPktIcon(x,y,o.lbl,o.col,o.isAck,false);
    else{
      ctx.globalAlpha=Math.max(0,1-(t-0.55)*5);
      drawPktIcon(x,y,o.lbl,o.col,o.isAck,o.lost);
      ctx.globalAlpha=1;
    }
    if(o.t>=1)o.done=true;
  }

  // check if all current batch done, start next
  if(anim.length>0&&anim.every(o=>o.done)&&queue.length>0){
    const nxt=queue.shift();
    anim=Array.isArray(nxt)?nxt:[nxt];
    logBatch(anim);
  } else if(anim.length===0&&queue.length>0){
    const nxt=queue.shift();
    anim=Array.isArray(nxt)?nxt:[nxt];
    logBatch(anim);
  }

  if(queue.length===0&&(anim.length===0||anim.every(o=>o.done))){
    if(running){
      running=false;
      document.getElementById('sbtn').disabled=false;
      lg('✔ Simulation complete.','ok');
    }
    drawScene();
    return;
  }
  rafId=requestAnimationFrame(tick);
}

function logBatch(batch){
  batch.forEach(o=>{
    if(!o.isAck){
      if(o.lost)lg(`→ Sending ${o.lbl} → LOST in transit!`,'er');
      else lg(`→ Sending ${o.lbl}`,'i');
    } else {
      if(o.lost)lg(`← ${o.lbl} lost in transit!`,'er');
      else lg(`← ${o.lbl} received ✓`,'ok');
    }
  });
}

function buildStopWait(){
  const rx=getRX();
  const q=[];
  const span=BOT-TOP;
  const step=span/Math.max(cfg.cycles,1);
  for(let c=0;c<cfg.cycles;c++){
    const y0=TOP+c*step+step*0.15;
    const y1=TOP+c*step+step*0.55;
    const y2=TOP+c*step+step*0.85;
    const seq=c+1;
    const col=PKT_COL[c%PKT_COL.length];
    q.push([makePkt(SX,y0,rx,y1,col,'P'+seq,false,false,0)]);
    q.push([makePkt(rx,y1,SX,y2,'#34d399','ACK'+seq,false,true,0)]);
  }
  return q;
}

function buildSliding(){
  const rx=getRX();
  const q=[];
  const W2=cfg.winSize;
  const span=BOT-TOP;
  const cycleH=span/Math.max(cfg.cycles,1);
  let seqBase=1;
  for(let c=0;c<cfg.cycles;c++){
    const base=TOP+c*cycleH;
    const pktH=cycleH*0.45/W2;
    const ackH=cycleH*0.45/W2;
    const pktLost=cfg.mode==='loss'&&Math.random()<0.35?Math.floor(Math.random()*W2):-1;
    const ackLost=cfg.mode==='loss'&&pktLost<0&&Math.random()<0.3?Math.floor(Math.random()*W2):-1;

    // all packets in window sent simultaneously (staggered diagonally)
    const pktBatch=[];
    const seqs=[];
    for(let i=0;i<W2;i++){
      const seq=seqBase+i;seqs.push(seq);
      const col=PKT_COL[(seq-1)%PKT_COL.length];
      const y0=base+8+i*pktH*1.2;
      const yMid=base+cycleH*0.48+i*pktH*0.3;
      const lost=i===pktLost;
      pktBatch.push(makePkt(SX,y0,rx,yMid,col,'P'+seq,lost,false,i*0.18));
    }
    q.push(pktBatch);

    // acks for non-lost packets
    const ackBatch=[];
    for(let i=0;i<W2;i++){
      const seq=seqs[i];
      if(i===pktLost)continue;
      const lost=i===ackLost;
      const yStart=base+cycleH*0.48+i*pktH*0.3;
      const yEnd=base+cycleH*0.9+i*ackH*0.3;
      ackBatch.push(makePkt(rx,yStart,SX,yEnd,'#34d399','ACK'+seq,lost,true,i*0.15));
    }
    if(ackBatch.length>0)q.push(ackBatch);

    // retransmit lost packet
    if(pktLost>=0){
      const seq=seqs[pktLost];
      const col=PKT_COL[(seq-1)%PKT_COL.length];
      const yR0=base+cycleH*0.55;
      const yR1=base+cycleH*0.82;
      q.push([makePkt(SX,yR0,rx,yR1,col,'P'+seq+'↺',false,false,0)]);
      q.push([makePkt(rx,yR1,SX,yR1+cycleH*0.1,'#34d399','ACK'+seq,false,true,0)]);
    }

    seqBase+=W2;
  }
  return q;
}

function startViz(){
  if(running)return;
  running=true;
  clrLog();
  lg('▶ Simulation started','i');
  document.getElementById('sbtn').disabled=true;
  if(rafId)cancelAnimationFrame(rafId);
  anim=[];

  const batches=cfg.sliding?buildSliding():buildStopWait();
  queue=[...batches];

  if(queue.length>0){
    const nxt=queue.shift();
    anim=Array.isArray(nxt)?nxt:[nxt];
    logBatch(anim);
  }
  rafId=requestAnimationFrame(tick);
}

// initial draw
drawScene();
</script>
